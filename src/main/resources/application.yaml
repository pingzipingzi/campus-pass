server:
  port: 8080
spring:
  application:
    name: campus-pass
  datasource:
      driver-class-name: com.mysql.cj.jdbc.Driver
      url: ${MYSQL_URL}
      username: ${MYSQL_USERNAME}
      password: ${MYSQL_PASSWORD}
  data:
      redis:
        host: ${REDIS_HOST}
        port: 6379
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: 5672
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: ${RABBITMQ_VIRTUAL_HOST}
    listener:
      simple:
        prefetch: 1  #每次只能获取一条消息，处理完成才能获取下一个消息，避免预分配导致处理速度不同的消费者均分要处理的消息
        retry:
          enabled: true
          max-retries: 3
          initial-interval: 1s
          multiplier: 2
          max-interval: 10s
        default-requeue-rejected: false #被拒绝后，不会返回原队列
  jackson:
      default-property-inclusion: non_null #json处理忽略空字段
mybatis-plus:
  type-aliases-package: com.example.campuspass.entity #类型别名，使用xml不用导全类名
logging:
  level:
    com.example.campuspass: debug

campus-pass:
  jwt:
    secret-base64: ${CAMPUS_PASS_JWT_SECRET}

